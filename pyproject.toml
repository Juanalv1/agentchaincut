[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchaincut"
version = "0.1.0"
description = "Compile and prove least-privilege policies for MCP-connected AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "pyyaml>=6.0",
    "ortools>=9.8",
    "networkx>=3.2",
    "mcp>=2.3,<3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic>=1.0"]

[project.scripts]
acc = "acc.cli:main"

[tool.setuptools.packages.find]
include = ["acc*", "world*", "proxy*", "eval*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
