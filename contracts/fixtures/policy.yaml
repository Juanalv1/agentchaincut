# Least-privilege policy for the demo support agent (fixture for policy.schema.json).
# Tools not listed for an agent are denied (fail-closed).
agents:
  - name: support-agent
    tools:
      tickets.get:
        mode: scoped
        constraints: [{arg: ticket_id, op: eq, ctx: ticket.id, invariant: inv-5}]
      tickets.add_note:
        mode: scoped
        constraints: [{arg: ticket_id, op: eq, ctx: ticket.id, invariant: inv-4}]
      billing.invoice_read:
        mode: scoped
        constraints: [{arg: invoice_id, op: in, ctx: customer.invoice_ids, invariant: inv-1}]
      mail.send:
        mode: scoped
        constraints: [{arg: to, op: eq, ctx: ticket.customer.email, invariant: inv-3}]
      billing.refund:
        mode: approval
      billing.invoice_list_all:
        mode: deny
legs_per_session: {U: true, S: true, X: bounded}
solver:
  status: OPTIMAL
  method: cp-sat
  objective: 3
  broken_tasks: []
conflicts:
  - task: refund_request
    legs: [U, S, X]
    core: [billing.refund]
    fixes:
      - {type: approval_edge, tool: billing.refund}
      - type: split_agent
        partition:
          - [tickets.get, tickets.add_note, mail.send]
          - [billing.invoice_read, billing.refund]
    resolved_by: approval_edge
